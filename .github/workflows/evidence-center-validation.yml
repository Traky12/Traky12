name: Evidence Center validation

# No path filters: "Validate evidence dossiers" is a REQUIRED status check on
# main. A path-filtered required check never reports on PRs that do not touch
# evidence-center/, leaving them permanently BLOCKED (2026-09-28).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-evidence-center:
    name: Validate evidence dossiers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation dependency
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml

      - name: Reject tracked private material
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|\.env\.|.*\.pem$|.*\.key$|id_rsa|credentials\.json)$'; then
            echo 'Private environment or key-like file is tracked.'
            exit 1
          fi

      - name: Scan high-risk secret patterns
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files 'evidence-center/**' || true)
          if [ -n "$files" ] && grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{30,})' $files; then
            echo 'High-risk secret pattern detected.'
            exit 1
          fi

      - name: Validate dossiers and provenance
        run: python3 evidence-center/validate_evidence_center.py
