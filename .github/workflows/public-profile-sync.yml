name: Public profile state sync

# DISABLED (P0, 2026-09-28) — TEMPORARY CONTAINMENT, NOT THE FINAL DESIGN.
# castuo-evolution is not the current authority, and this sync failed on every
# run since 2026-08-22 (Not Found: private repo), leaving a stale state block
# presented as live. Manual dispatch only; do not re-enable the schedule until
# a redesign provides ALL of:
#   1. a public source, or controlled authenticated access (scoped token);
#   2. a read test that fails the job loudly when the source is unreachable;
#   3. content validation of the generated block before commit;
#   4. failure monitoring and an alert on failed runs;
#   5. a visible "last successful update" date in the README.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout canonical control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Traky12/castuo-evolution
          token: ${{ secrets.CASTUO_CONTROL_PLANE_TOKEN || github.token }}
          path: _control-plane
      - name: Generate bounded public state
        run: |
          python3 _control-plane/scripts/generate_public_profile.py \
            --status _control-plane/data/control-plane-status.yaml \
            --readme README.md
      - name: Check generated diff
        run: git diff --check
      - name: Commit generated state
        run: |
          if git diff --quiet -- README.md; then
            echo 'No public state change.'
          else
            git config user.name 'castuo-control-plane[bot]'
            git config user.email 'castuo-control-plane[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'docs: sync public state from control plane'
            git push
          fi
