name: Public profile state sync

# DISABLED (P0, 2026-09-28): castuo-evolution is not the current authority
# and this sync failed on every run since 2026-08-22 (Not Found: private repo).
# Kept for history; manual dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical control plane
        uses: actions/checkout@v4
        with:
          repository: Traky12/castuo-evolution
          token: ${{ secrets.CASTUO_CONTROL_PLANE_TOKEN || github.token }}
          path: _control-plane
      - name: Generate bounded public state
        run: |
          python3 _control-plane/scripts/generate_public_profile.py \
            --status _control-plane/data/control-plane-status.yaml \
            --readme README.md
      - name: Check generated diff
        run: git diff --check
      - name: Commit generated state
        run: |
          if git diff --quiet -- README.md; then
            echo 'No public state change.'
          else
            git config user.name 'castuo-control-plane[bot]'
            git config user.email 'castuo-control-plane[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'docs: sync public state from control plane'
            git push
          fi
