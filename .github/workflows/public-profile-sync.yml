name: Public profile state sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    name: sync
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public profile boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'PROMOTION-BLOCKED' README.md
          grep -q 'EVIDENCE-SCOPED' README.md
          grep -q 'oneR=false' README.md
          grep -q 'oneV=false' README.md
          grep -q 'oneA=false' README.md
          if grep -RInE '(-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|ghp_[A-Za-z0-9]{30,}|CASTUO_SNAPSHOT_SIGNING_KEY_B64)' README.md docs; then
            echo 'High-risk secret pattern detected.'
            exit 1
          fi

  sync-control-plane:
    name: sync-control-plane
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Checkout canonical control plane
        uses: actions/checkout@v4
        with:
          repository: Traky12/castuo-evolution
          token: ${{ secrets.CASTUO_CONTROL_PLANE_TOKEN || github.token }}
          path: _control-plane
      - name: Generate bounded public state
        run: |
          python3 _control-plane/scripts/generate_public_profile.py \
            --status _control-plane/data/control-plane-status.yaml \
            --readme README.md
      - name: Check generated diff
        run: git diff --check
      - name: Reject unsafe generated content
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '(-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|ghp_[A-Za-z0-9]{30,}|CASTUO_SNAPSHOT_SIGNING_KEY_B64)' README.md; then
            echo 'High-risk secret pattern detected.'
            exit 1
          fi
      - name: Commit generated state
        run: |
          if git diff --quiet -- README.md; then
            echo 'No public state change.'
          else
            git config user.name 'castuo-control-plane[bot]'
            git config user.email 'castuo-control-plane[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'docs: sync public state from control plane'
            git push
          fi
