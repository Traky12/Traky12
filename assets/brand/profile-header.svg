<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-first systems engineering</title>
  <desc id="desc">A dark technical canvas with connected evidence nodes, emphasizing traceability, offline-first systems and assurance.</desc>
  <style>
    .motion-flow{stroke-dasharray:8 12;animation:motion-flow 4.8s linear infinite}
    .motion-nodes circle{transform-box:fill-box;transform-origin:center;animation:motion-node 3.6s ease-in-out infinite}
    .motion-nodes circle:nth-of-type(3n+2){animation-delay:-1.7s}
    .motion-nodes circle:nth-of-type(3n){animation-delay:-3.4s}
    .motion-glow{transform-box:fill-box;transform-origin:center;animation:motion-glow 4.4s ease-in-out infinite}
    @keyframes motion-flow{to{stroke-dashoffset:-80}}
    .motion-signal{offset-rotate:0deg;offset-distance:0%;opacity:0;transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 4px #9CF4D8);animation:motion-travel var(--duration,2.5s) cubic-bezier(.4,0,.2,1) infinite;animation-delay:var(--delay,0s)}
    @keyframes motion-travel{0%{offset-distance:0%;opacity:0;transform:scale(.7)}14%,82%{opacity:1;transform:scale(1.15)}100%{offset-distance:100%;opacity:0;transform:scale(.7)}}
    @keyframes motion-node{0%,100%{opacity:.68;transform:scale(.98)}50%{opacity:1;transform:scale(1.18)}}
    @keyframes motion-glow{0%,100%{opacity:.08;transform:scale(.94)}50%{opacity:.36;transform:scale(1.08)}}
    @media (prefers-reduced-motion:reduce){.motion-flow,.motion-nodes circle,.motion-glow,.motion-signal{animation:none!important}.motion-flow{stroke-dasharray:none;stroke-dashoffset:0}.motion-nodes circle{transform:none}.motion-signal{display:none;filter:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1724"/>
      <stop offset="0.58" stop-color="#112638"/>
      <stop offset="1" stop-color="#142E3B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CD6BF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5CD6BF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7892A3" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1440" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1440" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1130" cy="146" r="230" fill="url(#glow)"/>
  <path class="motion-flow" d="M845 50L960 110L1080 70L1190 135L1322 92" fill="none" stroke="#5CD6BF" stroke-opacity="0.48" stroke-width="2"/>
  <path class="motion-flow" d="M840 230L965 182L1087 229L1198 171L1333 228" fill="none" stroke="#8EB8C8" stroke-opacity="0.36" stroke-width="2"/>
  <path class="motion-flow" d="M960 110L965 182M1080 70L1087 229M1190 135L1198 171M1322 92L1333 228" fill="none" stroke="#8EB8C8" stroke-opacity="0.2" stroke-width="1.5"/>
  <g class="motion-nodes" fill="#102A3A" stroke="#5CD6BF" stroke-width="2">
    <circle cx="845" cy="50" r="6"/><circle cx="960" cy="110" r="7"/><circle cx="1080" cy="70" r="6"/>
    <circle cx="1190" cy="135" r="8"/><circle cx="1322" cy="92" r="6"/><circle cx="840" cy="230" r="6"/>
    <circle cx="965" cy="182" r="6"/><circle cx="1087" cy="229" r="8"/><circle cx="1198" cy="171" r="6"/><circle cx="1333" cy="228" r="6"/>
  </g>
  <g aria-hidden="true">
    <circle class="motion-signal" r="4" fill="#E8FFF8" style="offset-path:path('M845 50L960 110L1080 70L1190 135L1322 92');--duration:5s;--delay:-1.1s"/>
    <circle class="motion-signal" r="3" fill="#B4F7E3" style="offset-path:path('M840 230L965 182L1087 229L1198 171L1333 228');--duration:5.8s;--delay:-3.2s"/>
  </g>
  <g fill="#EAF2F6">
    <rect x="72" y="67" width="5" height="112" rx="2.5" fill="#5CD6BF"/>
    <text x="101" y="87" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3.5" fill="#84E4D2">EVIDENCE-FIRST ENGINEERING</text>
    <text x="98" y="145" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="43" font-weight="700" letter-spacing="-1.3">Systems that can be reviewed.</text>
    <text x="101" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#B8CBD5">Traceability · Offline-first · Explicit assurance</text>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">
    <rect x="850" y="258" width="144" height="30" rx="15" fill="#173847" stroke="#2D756F"/>
    <text x="922" y="277" fill="#9BE8D9" text-anchor="middle">TRACEABILITY</text>
    <rect x="1004" y="258" width="150" height="30" rx="15" fill="#173847" stroke="#2D756F"/>
    <text x="1079" y="277" fill="#9BE8D9" text-anchor="middle">OFFLINE-FIRST</text>
    <rect x="1164" y="258" width="134" height="30" rx="15" fill="#173847" stroke="#2D756F"/>
    <text x="1231" y="277" fill="#9BE8D9" text-anchor="middle">ASSURANCE</text>
  </g>
</svg>