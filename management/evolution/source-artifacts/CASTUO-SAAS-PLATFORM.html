function makeQrSvg(text,size){
  size=size||180;
  try{
    var qr=qrcode(0,"M");
    qr.addData(text);
    qr.make();
    var count=qr.getModuleCount();
    var cellSize=size/count;
    var paths=[];
    for(var r=0;r<count;r++){for(var c=0;c<count;c++){if(qr.isDark(r,c)){paths.push(h("rect",{key:r+"-"+c,x:+(c*cellSize).toFixed(2),y:+(r*cellSize).toFixed(2),width:+cellSize.toFixed(2)+0.5,height:+cellSize.toFixed(2)+0.5,fill:"#1a1c18"}));}}}
    return h("svg",{width:size,height:size,viewBox:"0 0 "+size+" "+size,xmlns:"http://www.w3.org/2000/svg"},h("rect",{width:size,height:size,fill:"#ffffff"}),paths);
  }catch(e){return h("div",{style:{width:size,height:size,background:"#f0f0f0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"#999"}},"QR error");}
}

/* ═══ 3D INTERACTIVO + FOTOGRAMETRIA ═══ */
function Foto3dTab(p){
  var cvRef=useRef(null);
  var scRef=useRef(null);
  var ms=useState("3d"),viewMode=ms[0],setViewMode=ms[1];
  var ss=useState(12),scale=ss[0],setScale=ss[1];
  var ds=useState(1),day=ds[0],setDay=ds[1];
  var ps=useState(false),playing=ps[0],setPlaying=ps[1];
  var rs=useState(false),ready=rs[0],setReady=rs[1];

  /* Build 3D scene */
  useEffect(function(){
    if(!cvRef.current||scRef.current)return;
    var W=cvRef.current.clientWidth,H=340;
    var T=window.THREE||null;
    /* Load Three.js from CDN if not present */
    if(!T){
      var s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
      s.onload=function(){initScene();};
      document.head.appendChild(s);
    }else{initScene();}

    function initScene(){
      T=window.THREE;if(!T)return;
      var scene=new T.Scene();scene.background=new T.Color(0xf0f4ec);
      var camera=new T.PerspectiveCamera(50,W/H,0.1,200);
      var renderer=new T.WebGLRenderer({antialias:true,alpha:true});
      renderer.setSize(W,H);renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled=true;
      cvRef.current.innerHTML="";cvRef.current.appendChild(renderer.domElement);

      /* Lights */
      scene.add(new T.AmbientLight(0xffffff,0.5));
      var sun=new T.DirectionalLight(0xffffff,0.7);sun.position.set(8,12,6);sun.castShadow=true;scene.add(sun);

      /* Ground */
      var gnd=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshLambertMaterial({color:0xd4c9a8}));
      gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);

      /* Greenhouse structure — glass box */
      var ghW=scale<=12?3:scale<=60?6:12,ghD=scale<=12?4:scale<=60?8:16,ghH=3.5;
      var frame=new T.Mesh(new T.BoxGeometry(ghW,ghH,ghD),new T.MeshPhongMaterial({color:0xc0c0c0,wireframe:true}));
      frame.position.y=ghH/2;scene.add(frame);
      var glass=new T.Mesh(new T.BoxGeometry(ghW-0.1,ghH-0.1,ghD-0.1),new T.MeshPhongMaterial({color:0xadd8e6,transparent:true,opacity:0.15}));
      glass.position.y=ghH/2;scene.add(glass);

      /* NFT channels (10 levels) */
      var channels=[];var levels=10;var spacing=ghH/levels;
      for(var lv=0;lv<levels;lv++){
        var chW=ghW*0.85,chD=ghD*0.85;
        var ch=new T.Mesh(new T.BoxGeometry(chW,0.04,chD),new T.MeshPhongMaterial({color:0xe8e8e8}));
        ch.position.y=0.3+lv*spacing;ch.castShadow=true;scene.add(ch);
        channels.push(ch);

        /* Trays per level — 6 per level */
        for(var t=0;t<6;t++){
          var tw=chW/6*0.9,td=chD*0.9;
          var tray=new T.Mesh(new T.BoxGeometry(tw,0.06,td),new T.MeshPhongMaterial({color:0x228B22}));
          tray.position.set(-chW/2+tw/2+t*(chW/6)+chW/12,0.3+lv*spacing+0.05,0);
          tray.castShadow=true;scene.add(tray);

          /* Plants on tray */
          for(var px=0;px<3;px++){
            var plant=new T.Mesh(new T.SphereGeometry(tw*0.15,6,6),new T.MeshPhongMaterial({color:0x2d7a4f}));
            plant.position.set(tray.position.x-tw*0.3+px*tw*0.3,tray.position.y+tw*0.15,tray.position.z);
            plant.userData={level:lv,trayIdx:t,plantIdx:px};
            scene.add(plant);
          }
        }
      }

      /* Pipes (blue lines along sides) */
      for(var side=0;side<2;side++){
        var pipe=new T.Mesh(new T.CylinderGeometry(0.03,0.03,ghH,6),new T.MeshPhongMaterial({color:0x2563eb}));
        pipe.position.set(side===0?-ghW/2-0.1:ghW/2+0.1,ghH/2,0);scene.add(pipe);
      }

      /* Sensors (red spheres at corners) */
      var sensorPositions=[[ghW/2,ghH,ghD/2],[-ghW/2,ghH,ghD/2],[ghW/2,ghH,-ghD/2],[-ghW/2,ghH,-ghD/2],[0,ghH/2,ghD/2],[0,ghH/2,-ghD/2]];
      sensorPositions.forEach(function(sp){
        var sens=new T.Mesh(new T.SphereGeometry(0.08,8,8),new T.MeshPhongMaterial({color:0xdc2626,emissive:0xff0000,emissiveIntensity:0.3}));
        sens.position.set(sp[0],sp[1],sp[2]);scene.add(sens);
      });

      /* Label: scale */
      camera.position.set(ghW*1.2,ghH*1.1,ghD*1.2);camera.lookAt(0,ghH/2,0);

      /* Mouse drag rotation */
      var isDragging=false,prevX=0,prevY=0,rotY=0,rotX=0.3;
      renderer.domElement.addEventListener("mousedown",function(e){isDragging=true;prevX=e.clientX;prevY=e.clientY;});
      renderer.domElement.addEventListener("mousemove",function(e){if(!isDragging)return;rotY+=(e.clientX-prevX)*0.005;rotX+=(e.clientY-prevY)*0.005;rotX=Math.max(-1,Math.min(1,rotX));prevX=e.clientX;prevY=e.clientY;});
      renderer.domElement.addEventListener("mouseup",function(){isDragging=false;});
      renderer.domElement.addEventListener("mouseleave",function(){isDragging=false;});

      /* Scroll zoom */
      renderer.domElement.addEventListener("wheel",function(e){
        var d=e.deltaY>0?1.05:0.95;
        camera.position.multiplyScalar(d);
        e.preventDefault();
      },{passive:false});

      /* Render loop */
      var t0=0;
      function animate(time){
        requestAnimationFrame(animate);
        var radius=camera.position.length();
        camera.position.x=Math.sin(rotY)*Math.cos(rotX)*radius;
        camera.position.y=Math.sin(rotX)*radius+ghH/2;
        camera.position.z=Math.cos(rotY)*Math.cos(rotX)*radius;
        camera.lookAt(0,ghH/2,0);

        /* Animate plants subtle sway */
        scene.children.forEach(function(obj){
          if(obj.userData&&obj.userData.plantIdx!==undefined){
            obj.position.y+=Math.sin(time*0.002+obj.userData.level)*0.001;
          }
        });

        renderer.render(scene,camera);
      }
      animate(0);
      scRef.current={scene:scene,camera:camera,renderer:renderer};
      setReady(true);
    }
    return function(){if(cvRef.current)cvRef.current.innerHTML="";scRef.current=null;};
  },[scale]);

  /* Timeline autoplay */
  useEffect(function(){
    if(!playing)return;
    var iv=setInterval(function(){setDay(function(d){return d>=28?1:d+1;});},400);
    return function(){clearInterval(iv);};
  },[playing]);

  /* Update plant colors based on viewMode and day */
  useEffect(function(){
    if(!scRef.current)return;
    var scene=scRef.current.scene;
    scene.children.forEach(function(obj){
      if(!obj.userData||obj.userData.plantIdx===undefined)return;
      var growth=Math.min(1,day/14);
      obj.scale.setScalar(0.3+growth*0.7);

      if(viewMode==="3d"){
        obj.material.color.setHex(day>21?0x2d7a4f:day>14?0x48a86a:day>7?0x6dc98a:0xa8e6bc);
      }else if(viewMode==="ndvi"){
        var ndvi=0.3+growth*0.6+Math.random()*0.1;
        if(ndvi>0.7)obj.material.color.setHex(0x006400);
        else if(ndvi>0.5)obj.material.color.setHex(0x90EE90);
        else if(ndvi>0.3)obj.material.color.setHex(0xFFFF00);
        else obj.material.color.setHex(0xFF4500);
      }else if(viewMode==="stress"){
        var stress=Math.random();
        if(obj.userData.level>7)stress+=0.3;/* Upper levels more stressed */
        obj.material.color.setHex(stress>0.6?0xdc2626:stress>0.3?0xd97706:0x2d7a4f);
      }
    });
  },[viewMode,day]);

  return h("div",null,
    h("h2",{style:{fontSize:16,fontWeight:800,color:P.tx,margin:"0 0 8px",fontFamily:FD}},"Digital Twin 3D — Invernadero NFT"),

    setTesting(true);setTestResult("");
    var url=p.apiBase.replace(/\/$/,"")+"/api/v1/system/health";

  function saveUsers(list){setUserList(list);localStorage.setItem("castuo_users",JSON.stringify(list));}

    if(userList.find(function(u){return u.email===newUser.email;})){alert("Email ya registrado");return;}
    if(newUser.password&&newUser.password.length<6){alert("Contrasena minimo 6 caracteres");return;}

  }

    if(secMsgs.length>0)setSecMsg("Claves comprometidas eliminadas: "+secMsgs.join(", ")+". Revocalas en las consolas de cada servicio.");

  var sas=useState(JSON.parse(localStorage.getItem("castuo_sabionda_alerts")||"[]")),sabiondaAlerts=sas[0],setSabiondaAlerts=sas[1];

  function evaluateSabionda(sensorData,currentLots){
    var now=Date.now();var newAlerts=[];
    /* HARD-FAIL GUARD: skip evaluation if soil sensors are offline >10s */
    var criticalKeys=["soil1","soil2","soil3"];
    var offlineSensors=criticalKeys.filter(function(k){return sensorData[k]&&isHardFail(sensorData[k]);});
    if(offlineSensors.length>0){
      if(!lastRuleTs.current["HARDFAIL"]||(now-lastRuleTs.current["HARDFAIL"])>60000){
        lastRuleTs.current["HARDFAIL"]=now;
        newAlerts.push({id:"HARDFAIL-"+now,rule:"HARDFAIL",severity:"alta",message:"SENSORES OFFLINE: "+offlineSensors.join(", ")+". Decisiones BLOQUEADAS.",action:"Verificar conexion ESP32/RPi. Sin datos >10s.",value:offlineSensors.length,timestamp:new Date().toISOString(),source:"hardfail"});
        setSabiondaAlerts(function(prev){var u=newAlerts.concat(prev).slice(0,50);localStorage.setItem("castuo_sabionda_alerts",JSON.stringify(u));return u;});
      }
      return;/* BLOCK all rule evaluation on stale data */
    }
    /* PHYSICAL VALIDATION */
    Object.keys(sensorData).forEach(function(k){if(sensorData[k]&&!validateSensor(k,sensorData[k].v)){sensorData[k].s="invalid";}});

    /* Only real connected sensors — expandable when more hardware added */
    var soil1=sensorData.soil1?sensorData.soil1.v:null;
    var soil2=sensorData.soil2?sensorData.soil2.v:null;
    var soil3=sensorData.soil3?sensorData.soil3.v:null;
    /* Future sensors (activate when hardware connected) */
    var ph=sensorData.ph?sensorData.ph.v:null;
    var ec=sensorData.ec?sensorData.ec.v:null;
    var temp=sensorData.temp?sensorData.temp.v:null;
    var hum=sensorData.hum?sensorData.hum.v:null;
    var flow=sensorData.flow?sensorData.flow.v:null;
    var o3=sensorData.o3?sensorData.o3.v:null;

    function fire(rule,sev,msg,act,val){
      var cd=COOLDOWNS[rule]||300000;
      if(lastRuleTs.current[rule]&&(now-lastRuleTs.current[rule])<cd)return;
      lastRuleTs.current[rule]=now;
      newAlerts.push({id:rule+"-"+now,rule:rule,severity:sev,message:msg,action:act,value:val,timestamp:new Date().toISOString(),source:connStatus==="connected"?"backend+local":"local"});
    }

    /* ═══ ACTIVE RULES — Only fire for connected sensors ═══ */

    /* R1-R7: Only activate when corresponding sensor hardware is connected */
    if(hum!==null&&hum<30)fire("R1","alta","Humedad "+hum.toFixed(0)+"% critica","OPEN riego 30min",hum);
    if(flow!==null&&flow<10)fire("R2","alta","Flujo "+flow.toFixed(1)+" L/min bajo","CHECK bomba",flow);
    if(ph!==null&&ph>6.8)fire("R3","alta","pH "+ph.toFixed(2)+" alto","ACID ON 5ml",ph);
    if(ph!==null&&ph<5.5)fire("R3","alta","pH "+ph.toFixed(2)+" bajo","CHECK FERT dosis",ph);
    if(ec!==null&&ec>2.2)fire("R4","alta","EC "+ec.toFixed(2)+" alto","RO-IN 2min",ec);
    if(ec!==null&&ec<0.8)fire("R4","media","EC "+ec.toFixed(2)+" bajo","FERT-A + FERT-B",ec);
    if(temp!==null&&temp>28)fire("R5","alta","Temp "+temp.toFixed(1)+"C alta","Ventilacion",temp);
    if(temp!==null&&temp<14)fire("R6","alta","Temp "+temp.toFixed(1)+"C baja","Calefactor",temp);
    if(o3!==null&&o3>0.12)fire("R7","alta","O3 "+o3.toFixed(3)+" ppm alto","O3-GEN OFF",o3);

    /* R8: Pre-harvest (always active — uses lot data, not sensors) */
    var harvestLots=currentLots.filter(function(l){return l.totalDays-l.day<=1&&l.phase!=="Cerrado";});
    if(harvestLots.length>0)fire("R8","media","Pre-cosecha: "+harvestLots.map(function(l){return l.code;}).join(", "),"Subir luz, bajar EC, preparar cosecha",harvestLots.length);

    /* R9: Soil moisture low (real AZDelivery V1.2 sensors) */
    var soil1=sensorData.soil1?sensorData.soil1.v:null;
    var soil2=sensorData.soil2?sensorData.soil2.v:null;
    var soil3=sensorData.soil3?sensorData.soil3.v:null;
    var soilAvg=null;var soilCount=0;

    else if(soilAvg!==null&&soilAvg<40)fire("R9","media","Humedad suelo "+soilAvg.toFixed(0)+"% baja. Vigilar riego","Verificar riego sustrato",soilAvg);

    if(newAlerts.length>0){

        localStorage.setItem("castuo_sabionda_alerts",JSON.stringify(updated));
        return updated;
      });
    }
  }

          else if(Date.now()-lastApiTs.current>15000)setConnStatus("simulated");
        });
    }

    /* 2. Try WebSocket for real-time */
    function connectWs(){
      if(stopped||!apiBase)return;
      var wsUrl=apiBase.replace(/^http/,"ws").replace(/\/$/,"")+"/ws/sensors";
      try{
        var ws=new WebSocket(wsUrl);
        ws.onopen=function(){wsr.current=ws;setConnStatus("connected");};
        ws.onmessage=function(evt){
          try{
            var data=JSON.parse(evt.data);
            var ns={};
            Object.entries(data||{}).forEach(function(e){
              var k=e[0],v=e[1];
              var def=SDEFS[k];
              if(def&&typeof v==="number"){ns[k]={v:v,s:v<def.mn||v>def.mx?"crit":v<def.mn*1.05||v>def.mx*0.95?"warn":"ok"};}
            });
            if(Object.keys(ns).length>0)setSensors(function(prev){return Object.assign({},prev,ns);});
          }catch(e){}
        };
        ws.onclose=function(){wsr.current=null;if(!stopped)wsRetry=setTimeout(connectWs,5000);};
        ws.onerror=function(){ws.close();};
      }catch(e){}
    }

    /* 3. Simulation fallback (always runs to fill gaps) */
    function simulate(){
      if(stopped)return;
      var ns={};
      Object.entries(SDEFS).forEach(function(e){
        if(!sensors[e[0]]||connStatus==="simulated"){ns[e[0]]=gS(e[1]);}
      });
      if(Object.keys(ns).length>0&&connStatus==="simulated")setSensors(function(prev){return Object.assign({},prev,ns);});
    }

    /* Start all channels */
    if(apiBase){pollApi();connectWs();}else{setConnStatus("simulated");}
    iv=setInterval(function(){
      if(apiBase){pollApi();syncOfflineQueue();}
      simulate();
      /* SABIONDA auto-evaluation every cycle */
      evaluateSabionda(sensors,lots);
    },3000);

    return function(){stopped=true;clearInterval(iv);if(wsRetry)clearTimeout(wsRetry);if(wsr.current)wsr.current.close();};
  },[user,apiBase]);
