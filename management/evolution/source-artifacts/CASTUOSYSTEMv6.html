*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:calc(15px*var(--fs))}

#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:min(92vw,380px)}

<script>
"use strict";
/* ════════════════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════════════════ */
var CFG={
  VERSION:"6.0.0",
  WEB:"https://www.castuo-system.es",
  API:localStorage.getItem("castuo_api_url")||"https://api.castuo-system.es",
  WS:"wss://api.castuo-system.es/ws",

};

/* ═══ ALMACÉN SEGURO (localStorage con guardas) ═══ */
var store={
  get:function(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}},
  getJSON:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  setJSON:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}},
  del:function(k){try{localStorage.removeItem(k);}catch(e){}}
};

/* ═══ SEGURIDAD: sanitización, validación, sesión, auditoría ═══ */
function esc(s){if(s==null)return"";return String(s).replace(/[<>&"']/g,function(c){return{"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c];});}
function isEmail(e){return typeof e==="string"&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)&&e.length<=255;}
function isStrongPass(p){return typeof p==="string"&&p.length>=8&&p.length<=128;}
function fingerprint(){try{var n=navigator;return btoa((n.userAgent||"").slice(0,60)+(n.language||"")+(screen.width||0)+"x"+(screen.height||0)).slice(0,24);}catch(e){return"unknown";}}
function csrf(){var t=store.get("castuo_csrf");if(!t||t.length<32){t="";var a="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";for(var i=0;i<48;i++)t+=a[Math.floor(Math.random()*62)];store.set("castuo_csrf",t);}return t;}
/* Registro de auditoría inmutable (append-only, encadenado por hash) */
function audit(action,detail,level){
  var log=store.getJSON("castuo_audit",[]);
  var prev=log.length?log[0].h:"genesis";
  var payload=(new Date().toISOString())+action+String(detail||"")+prev;
  var entry={ts:new Date().toISOString(),u:(state.user&&state.user.email)||"anon",role:(state.user&&state.user.role)||"-",
    a:action,d:esc(String(detail||"")).slice(0,240),lvl:level||"info",fp:fingerprint(),prev:prev.slice(0,12),h:hash(payload)};
  log.unshift(entry);if(log.length>500)log=log.slice(0,500);
  store.setJSON("castuo_audit",log);
  if(level==="security"||level==="error"){var s=store.getJSON("castuo_sec",[]);s.unshift(entry);if(s.length>200)s=s.slice(0,200);store.setJSON("castuo_sec",s);}
  return entry;
}
/* hash determinista (FNV-1a 32bit hex) — trazabilidad, no criptografía */
function hash(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=(h*0x01000193)>>>0;}return("00000000"+h.toString(16)).slice(-8);}
function sha(prefix){return(prefix||"sha256:")+hash(Date.now()+":"+Math.random());}

/* ════════════════════ RBAC — control de acceso por rol ════════════════════
   admin = acceso total a TODO el sistema (superusuario). El resto: mínimo privilegio. */
var ROLES={
  admin:{name:"Administrador",icon:"👑",color:"var(--violet)",desc:"Acceso total al sistema completo",all:true,
    perms:["*"]},
  gestor:{name:"Gestor / Granjero",icon:"🧑‍🌾",color:"var(--green)",desc:"Explotación, ventas, ERP, trazabilidad",
    perms:["dashboard","arq360","cultivos","grid","control","invernadero","ganaderia","riego","cuaderno","qr","blockchain","auditoria","erp","crm","marketplace","billing","metricas","sabionda","resolucion","faq","config"]},

/* ════════════════════ CONECTIVIDAD RESILIENTE ════════════════════
   fetch con timeout + reintentos exponenciales + cola offline + auth/CSRF. */
function timeoutSignal(ms){try{return AbortSignal.timeout(ms);}catch(e){var c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal;}}
var net={online:navigator.onLine,latency:null,lastOk:null,queue:store.getJSON("castuo_queue",[])};
function saveQueue(){store.setJSON("castuo_queue",net.queue);}
async function apiFetch(path,opts){
  opts=opts||{};opts.headers=opts.headers||{};
  var token=store.get("castuo_token");
  if(token)opts.headers["Authorization"]="Bearer "+token;
  opts.headers["X-CSRF-Token"]=csrf();
  opts.headers["X-Request-ID"]=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  var url=/^https?:/.test(path)?path:(CFG.API+path);
  var retries=opts.retries==null?2:opts.retries;delete opts.retries;
  var t0=performance.now();
  for(var i=0;i<=retries;i++){
    try{
      opts.signal=timeoutSignal(opts.timeout||9000);
      var r=await fetch(url,opts);
      net.latency=Math.round(performance.now()-t0);net.lastOk=Date.now();net.online=true;
      return r;
    }catch(e){
      if(i===retries){net.online=navigator.onLine;throw e;}
      await new Promise(res=>setTimeout(res,Math.pow(2,i)*600));
    }
  }
}
/* Cola offline: acciones de escritura que se reenvían al recuperar conexión */
function enqueue(action){net.queue.push({id:sha("q:"),action:action,ts:Date.now()});saveQueue();updateNet();}
async function flushQueue(){
  if(!net.queue.length)return;
  var pending=net.queue.slice();
  for(var i=0;i<pending.length;i++){
    try{await apiFetch(pending[i].action.path,pending[i].action.opts);net.queue=net.queue.filter(q=>q.id!==pending[i].id);saveQueue();}
    catch(e){break;}
  }
  updateNet();
}
async function healthCheck(){
  try{
    var r=await apiFetch("/api/v1/system/health",{timeout:6000,retries:1});
    net.online=r.ok;if(r.ok)audit("health.ok","backend "+net.latency+"ms");
  }catch(e){net.online=false;}
  updateNet();
  if(net.online&&net.queue.length)flushQueue();
}

/* ════════════════════ MOTOR IA SABIONDA — con AHORRO DE TOKENS ════════════════════
   Estrategia de reducción de tokens (multi-capa):
   1. Motor de reglas local R1-R9 resuelve sin llamar a la IA cuando aplica.
   2. Caché de respuestas por hash de prompt (TTL) → 0 tokens en repeticiones.
   3. Selección de modelo por complejidad (small vs large).
   4. Compactación de contexto: solo se envían señales relevantes, no payloads crudos.
   5. Presupuesto/medidor de tokens visible y límite configurable. */
var AI={
  budget:store.getJSON("castuo_ai_budget",{used:0,saved:0,cap:200000,calls:0,cacheHits:0,ruleHits:0}),
  cache:store.getJSON("castuo_ai_cache",{}),
  save:function(){store.setJSON("castuo_ai_budget",this.budget);store.setJSON("castuo_ai_cache",this.cache);}
};
function estTokens(s){return Math.ceil((s||"").length/4);}
/* Motor de reglas declarativo R1-R9 (espejo de SABIONDA OMEGA backend) */
var RULES=[
  {id:"R1",when:s=>s.soil<30,sev:"alta",msg:"Humedad de suelo crítica (<30%). Activar riego zona afectada.",act:"riego"},
  {id:"R2",when:s=>s.soil>85,sev:"media",msg:"Sobresaturación hídrica (>85%). Cerrar válvula y drenar.",act:"drenar"},
  {id:"R3",when:s=>s.temp>30,sev:"alta",msg:"Temperatura alta (>30°C). Ventilar / sombreo.",act:"ventilar"},
  {id:"R4",when:s=>s.temp<8,sev:"alta",msg:"Riesgo de helada (<8°C). Activar protección térmica.",act:"calor"},
  {id:"R5",when:s=>s.ec>2.0,sev:"media",msg:"Conductividad EC alta (>2.0). Diluir solución nutritiva.",act:"diluir"},
  {id:"R6",when:s=>s.ph<5.5||s.ph>6.8,sev:"media",msg:"pH fuera de rango óptimo (5.5–6.8). Corregir.",act:"ph"},
  {id:"R7",when:s=>s.co2>1400,sev:"baja",msg:"CO₂ elevado en invernadero. Renovar aire.",act:"ventilar"},
  {id:"R8",when:s=>s.hum>90,sev:"media",msg:"Humedad ambiente >90%: riesgo fúngico (botrytis).",act:"deshumidificar"},
  {id:"R9",when:s=>s.offline,sev:"alta",msg:"Sensor sin datos >10s: fallo de gateway o alimentación.",act:"revisar"}
];
function ruleEngine(sig){var out=[];RULES.forEach(function(r){try{if(r.when(sig))out.push(r);}catch(e){}});return out;}
/* Consulta SABIONDA: local-first, luego caché, luego Mistral si procede */
async function sabionda(prompt,ctx){
  ctx=ctx||{};
  var key=hash(prompt.toLowerCase().trim()+JSON.stringify(ctx.sig||{}));
  var now=Date.now();
  /* 1. Caché */
  if(AI.cache[key]&&(now-AI.cache[key].ts)<3600000){
    AI.budget.cacheHits++;AI.budget.saved+=AI.cache[key].tok;AI.save();updateTok();
    return{text:AI.cache[key].text,source:"caché",tokens:0,saved:AI.cache[key].tok};
  }
  /* 2. Motor de reglas local (0 tokens) para señales de sensores */
  if(ctx.sig){
    var fired=ruleEngine(ctx.sig);
    if(fired.length){
      var txt="🔎 Diagnóstico local (motor de reglas R1-R9, sin coste de tokens):\n\n"+
        fired.map(f=>"• ["+f.id+"·"+f.sev.toUpperCase()+"] "+f.msg).join("\n")+
        "\n\nAcción recomendada priorizada: "+fired[0].msg;
      var estSaved=estTokens(txt)+estTokens(prompt);
      AI.budget.ruleHits++;AI.budget.saved+=estSaved;
      AI.cache[key]={text:txt,ts:now,tok:estSaved};AI.save();updateTok();
      return{text:txt,source:"motor de reglas (local)",tokens:0,saved:estSaved,rules:fired};
    }
  }
  /* 3. Contexto compacto (no payloads crudos) + selección de modelo */
  var apiKey=getKeys().MISTRAL_API_KEY;
  var compact="Contexto AgroTech (compacto): "+JSON.stringify(ctx.sig||{}).slice(0,300);
  var model=(prompt.length>200||/plan|estrategia|informe|análisis|analisis/i.test(prompt))?"mistral-large-latest":"mistral-small-latest";
  if(!apiKey){
    return{text:"⚠️ SABIONDA en modo OFFLINE (sin MISTRAL_API_KEY configurada).\n\nEl motor de reglas local sigue operativo. Configura la clave en Conectores para respuestas generativas. Diagnóstico basado en reglas y umbrales del sistema.",source:"offline",tokens:0,saved:0};
  }
  var body={model:model,messages:[
    {role:"system",content:"Eres SABIONDA OMEGA 9.1, motor agronómico de CASTÚO-SYSTEM. Responde en español, conciso, accionable, sin relleno. Máx 180 palabras."},
    {role:"user",content:compact+"\n\nPregunta: "+prompt}
  ],max_tokens:400,temperature:0.3};
  var inTok=estTokens(JSON.stringify(body));
  try{
    var r=await apiFetch("https://api.mistral.ai/v1/chat/completions",{
      method:"POST",headers:{"Authorization":"Bearer "+apiKey,"Content-Type":"application/json"},
      body:JSON.stringify(body),timeout:20000,retries:1});
    var j=await r.json();
    var text=(j.choices&&j.choices[0]&&j.choices[0].message.content)||"(sin respuesta)";
    var used=(j.usage&&j.usage.total_tokens)||inTok+estTokens(text);
    AI.budget.used+=used;AI.budget.calls++;
    AI.cache[key]={text:text,ts:now,tok:used};AI.save();updateTok();
    audit("sabionda.query",model+" · "+used+" tok");
    return{text:text,source:model,tokens:used,saved:0};
  }catch(e){
    return{text:"⚠️ Error de conexión con Mistral AI. Motor de reglas local disponible como respaldo. Detalle: "+esc(e.message||"timeout"),source:"error",tokens:0,saved:0};
  }
}

/* Estado de sensores simulado con deriva realista (se sustituye por datos MQTT reales) */
function readSensor(k){var d=SENSORS[k];var span=(d.mx-d.mn);var v=+(d.op+(Math.random()-0.5)*span*0.4).toFixed(k==="ph"||k==="ec"?2:1);
  var s=v<d.mn||v>d.mx?"crit":(v<d.mn+span*0.08||v>d.mx-span*0.08)?"warn":"ok";return{v:v,s:s,ts:Date.now()};}

/* Diagnóstico transversal — alimenta el Centro de Resolución */
function diagnostics(){
  var out=[];var snap=state.lastSnap||sensorSnapshot();var sig=sigFrom(snap);
  ruleEngine(sig).forEach(r=>out.push({sev:r.sev,mod:"grid",title:r.msg,act:r.act,rule:r.id}));
  if(!net.online)out.push({sev:"alta",mod:"conectores",title:"Backend sin respuesta — datos en modo local.",act:"health"});
  if(!hasKey("mistral"))out.push({sev:"baja",mod:"conectores",title:"SABIONDA en modo offline: falta MISTRAL_API_KEY.",act:"key"});
  if(!hasKey("stripe")&&can("billing"))out.push({sev:"baja",mod:"conectores",title:"Facturación Stripe no conectada.",act:"key"});
  if(AI.budget.cap-AI.budget.used<AI.budget.cap*0.1)out.push({sev:"media",mod:"sabionda",title:"Presupuesto de tokens IA por agotarse (<10%).",act:"budget"});
  if(net.queue.length)out.push({sev:"media",mod:"conectores",title:net.queue.length+" acción(es) en cola offline pendientes de sincronizar.",act:"flush"});
  return out;
}

function openModal(title,bodyHTML,footHTML){
  $("#modal").innerHTML='<div class="mh"><h3>'+esc(title)+'</h3><button class="iconbtn" aria-label="Cerrar" onclick="closeModal()">✕</button></div><div class="mb">'+bodyHTML+(footHTML?'<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">'+footHTML+'</div>':'')+'</div>';
  var bg=$("#modalbg");bg.classList.add("on");
  var f=$("#modal").querySelector("button,input,select,textarea");if(f)f.focus();
}
function closeModal(){$("#modalbg").classList.remove("on");}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
$("#modalbg").addEventListener("click",function(e){if(e.target===this)closeModal();});
function kpi(lab,val,unit,trend,tcolor){return'<div class="kpi"><div class="lab">'+lab+'</div><div class="val">'+val+(unit?' <small>'+unit+'</small>':'')+'</div>'+(trend?'<div class="trend" style="color:'+(tcolor||'var(--green)')+'">'+trend+'</div>':'')+'</div>';}
function tag(txt,cls){return'<span class="tag '+(cls||'n')+'">'+esc(txt)+'</span>';}
function sevTag(sev){return tag(sev.toUpperCase(),sev==="alta"?"r":sev==="media"?"a":"g");}
function bar(pct,color){return'<div class="bar"><i style="width:'+Math.max(0,Math.min(100,pct))+'%;background:'+(color||'var(--brand)')+'"></i></div>';}
function pageHead(title,lead){return'<div class="h1">'+esc(title)+'</div>'+(lead?'<p class="lead">'+esc(lead)+'</p>':'');}
function roChip(){return isReadonly()?'<span class="chip" style="color:var(--blue)">🔒 Solo lectura</span>':'';}

function updateNet(){
  var dot=$("#netdot"),txt=$("#nettxt");if(!dot)return;
  if(net.online){dot.className="dot g";txt.textContent=(net.latency?net.latency+"ms":"En línea")+(net.queue.length?" · "+net.queue.length+" cola":"");}
  else{dot.className="dot r";txt.textContent="Offline"+(net.queue.length?" · "+net.queue.length+" cola":"");}
  var sf=$("#sysfoot");if(sf)sf.innerHTML='API <span class="'+(net.online?'ok':'bad')+'">'+(net.online?'●':'○')+'</span> '+CFG.API.replace(/^https?:\/\//,'')+'<br>v'+CFG.VERSION+' · build '+CFG.BUILD;
}
function updateTok(){
  var el=$("#toktxt");if(!el)return;
  var pct=Math.round(AI.budget.used/AI.budget.cap*100);
  el.textContent=(AI.budget.saved>1000?(AI.budget.saved/1000).toFixed(1)+"k ahorr.":AI.budget.saved+" ahorr.");
  var p=$("#tokpill");if(p)p.style.borderColor=pct>90?"var(--red)":"var(--line)";
}

function doLogin(e){
  e.preventDefault();
  var email=$("#lgemail").value,pass=$("#lgpass").value;
  var attempts=store.getJSON("castuo_attempts",{n:0,until:0});
  if(attempts.until>Date.now()){toast("Cuenta bloqueada temporalmente. Espera unos minutos.","err");return;}
  if(!isEmail(email)||!isStrongPass(pass)){
    attempts.n++;if(attempts.n>=5){attempts.until=Date.now()+900000;attempts.n=0;audit("auth.lockout",email,"security");}
    store.setJSON("castuo_attempts",attempts);toast("Credenciales inválidas.","err");return;
  }
  store.setJSON("castuo_attempts",{n:0,until:0});
  var du=DEMO_USERS.find(u=>u.email===email)||{email:email,name:email.split("@")[0],role:"operario"};
  state.user={email:du.email,name:du.name,role:du.role,ts:Date.now(),fp:fingerprint()};
  store.setJSON("castuo_session",state.user);
  store.set("castuo_token","jwt."+hash(email+Date.now())+"."+csrf().slice(0,16));
  audit("auth.login",du.role,"security");
  bootApp();
}
function logout(){audit("auth.logout",state.user&&state.user.email,"security");store.del("castuo_session");store.del("castuo_token");state.user=null;location.reload();}

function renderNav(){
  var html="";
  GROUP_ORDER.forEach(function(g){
    var mods=MODULES.filter(m=>m.group===g&&can(m.id));
    if(!mods.length)return;
    html+='<div class="navgroup">'+g+'</div>';
    mods.forEach(function(m){
      var badge=typeof m.badge==="function"?m.badge():m.badge;
      html+='<button class="navitem" role="link" onclick="go(\''+m.id+'\')" '+(state.view===m.id?'aria-current="page"':'')+'>'+
        '<span class="ni" aria-hidden="true">'+m.icon+'</span><span>'+esc(m.name)+'</span>'+(badge?'<span class="nb">'+esc(badge)+'</span>':'')+'</button>';
    });
  });
  $("#nav").innerHTML=html;
}
function go(id){
  if(!can(id)){toast("Sin permiso para este módulo con el rol actual.","err");return;}
  state.view=id;
  var m=MODULES.find(x=>x.id===id);
  $("#crumb").innerHTML='<span>'+m.icon+' '+esc(m.name)+'</span><small>'+m.group+' · CASTÚO-SYSTEM v'+CFG.VERSION+'</small>';
  var fn=VIEWS[id]||VIEWS.dashboard;
  var out=fn();
  if(out&&out.then){$("#main").innerHTML='<div class="lead">Cargando…</div>';out.then(function(html){$("#main").innerHTML=html;if(VIEWS["_after_"+id])VIEWS["_after_"+id]();});}
  else{$("#main").innerHTML=out;if(VIEWS["_after_"+id])VIEWS["_after_"+id]();}
  renderNav();$("#main").focus();toggleNav(false);
  audit("nav",id);
}

    '<div class="grid g3" style="margin-bottom:16px">'+

function resolve(act,title){
  var actions={riego:"Válvula de riego abierta en zona afectada.",drenar:"Válvula cerrada, drenaje activado.",ventilar:"Ventilación forzada activada.",calor:"Protección térmica activada.",diluir:"Ciclo de dilución nutritiva programado.",ph:"Corrección de pH dosificada.",deshumidificar:"Deshumidificador activado.",revisar:"Ticket de mantenimiento generado.",health:"Reintentando conexión con backend…",key:"Abre Conectores para añadir la clave.",budget:"Aumenta el presupuesto en SABIONDA.",flush:"Sincronizando cola offline…"};
  if(act==="health"){healthCheck();}if(act==="flush"){flushQueue();}
  if(act==="key"){go("conectores");return;}if(act==="budget"){go("sabionda");return;}
  audit("resolve",act+": "+title);
  toast("✓ "+(actions[act]||"Acción ejecutada."));
  setTimeout(()=>go("resolucion"),400);
}

function editKey(id){
  var s=SERVICES.find(x=>x.id===id);var keys=getKeys();
  if(id==="backend"){openModal("🖥️ Backend CASTÚO",'<div class="field"><label>URL del backend</label><input id="kv" value="'+esc(CFG.API)+'" placeholder="https://api.castuo-system.es"></div><div class="notice i">Endpoint FastAPI. Se usa para health, IoT ingest y SABIONDA.</div>','<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveBackend()">Guardar</button>');return;}
  if(state.user.role!=="admin"){toast("Solo el administrador puede editar claves.","err");return;}
  openModal(s.icon+" "+s.name,'<div class="field"><label>'+esc(s.key)+'</label><input id="kv" type="password" value="'+esc(keys[s.key]||"")+'" placeholder="Pega la clave API"></div><div class="notice i">🔒 Se almacena solo en este navegador. Se incluye al exportar .env. Nunca se envía a terceros salvo al propio servicio al probar la conexión.</div>',
    '<button class="btn danger" onclick="setKey(\''+s.key+'\',\'\');closeModal();go(\'conectores\')">Quitar</button><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveKey(\''+s.key+'\')">Guardar</button>');
}
function saveKey(k){var v=document.getElementById("kv").value.trim();setKey(k,v);audit("key.set",k);closeModal();toast("Clave guardada de forma segura.");go("conectores");}
function saveBackend(){var v=document.getElementById("kv").value.trim();if(v){CFG.API=v;store.set("castuo_api_url",v);audit("config.api",v);healthCheck();}closeModal();toast("Backend actualizado.");go("conectores");}
async function testSvc(id){
  var s=SERVICES.find(x=>x.id===id);var keys=getKeys();var key=keys[s.key];toast("Probando "+s.name+"…");
  try{
    if(s.test==="health"){var r=await apiFetch("/api/v1/system/health",{timeout:6000,retries:1});toast(r.ok?"✓ Backend responde ("+net.latency+"ms)":"✗ Backend error "+r.status,r.ok?"":"err");return;}
    if(s.test==="noop"){toast("✓ "+s.name+": clave presente. Prueba real en backend.");return;}
    if(s.test==="telegram"){var tr=await apiFetch("https://api.telegram.org/bot"+key+"/getMe",{timeout:8000});var tj=await tr.json();toast(tj.ok?"✓ Telegram: @"+tj.result.username:"✗ Token inválido",tj.ok?"":"err");return;}
    if(s.test==="aemet"){toast("✓ AEMET: clave registrada (validación en backend).");return;}
    var opts={timeout:9000,headers:{}};var url=s.test;
    if(s.auth==="bearer")opts.headers["Authorization"]="Bearer "+key;
    if(s.auth==="query")url=s.test+encodeURIComponent(key||"");
    var rr=await fetch(url,opts);toast(rr.ok?"✓ "+s.name+" OK ("+rr.status+")":"✗ "+s.name+": "+rr.status,rr.ok?"":"err");
    audit("key.test",id+" "+rr.status);
  }catch(e){toast("✗ "+s.name+": "+esc(e.message||"error de red"),"err");}
}
function exportEnv(){
  var keys=getKeys();var env="# CASTÚO-SYSTEM v"+CFG.VERSION+" — .env (generado "+new Date().toISOString().slice(0,19)+")\n# NUNCA commitear este archivo. Usar Docker secrets en producción.\n\n";
  env+="API_URL="+CFG.API+"\nWEB_URL="+CFG.WEB+"\n\n";
  SERVICES.forEach(function(s){if(s.id==="backend")return;env+=s.key+"="+(keys[s.key]?keys[s.key]:"")+"\n";});
  env+="\n# JWT — generar con: openssl rand -hex 64\nJWT_SECRET=\nCASTUO_DEV_MODE=false\nCASTUO_CORS_ORIGINS="+CFG.WEB+"\n";
  openModal("📦 .env generado",'<div class="notice w">⚠️ Contiene secretos. Descárgalo a un lugar seguro y añádelo a .gitignore.</div><textarea rows="12" class="mono" style="font-size:11px" readonly>'+esc(env)+'</textarea>',
    '<button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" onclick="dlEnv()">⬇ Descargar .env</button>');
  window._envContent=env;
}
function dlEnv(){var blob=new Blob([window._envContent||""],{type:"text/plain"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=".env";a.click();audit("env.export","descargado");toast("✓ .env descargado");closeModal();}

function genQR(){
  var lot=document.getElementById("qrlot").value,v=document.getElementById("qrv").value;
  var url=CFG.WEB+"/dpp/"+encodeURIComponent(lot);
  /* QR sencillo renderizado como grid determinista (visual; el real lo genera el backend) */
  var seed=hash(lot+v),cells="";for(var i=0;i<225;i++){var on=parseInt(seed[i%8],16)%2===(i%3===0?0:1)||((i*7+seed.charCodeAt(i%8))%3===0);cells+='<rect x="'+(i%15)+'" y="'+Math.floor(i/15)+'" width="1" height="1" fill="'+(on?"var(--txt)":"transparent")+'"/>';}
  document.getElementById("qrout").innerHTML='<svg viewBox="-1 -1 17 17" style="width:170px;height:170px;background:#fff;border-radius:8px;padding:6px" role="img" aria-label="Código QR del pasaporte">'+cells+'</svg>'+
    '<div class="dl"><span>Lote</span><b class="mono">'+esc(lot)+'</b></div><div class="dl"><span>Producto</span><b>'+esc(v)+'</b></div><div class="dl"><span>Origen</span><b>CTAEX · Extremadura</b></div><div class="dl"><span>Hash</span><b class="mono">'+hash(lot+v+td())+'</b></div><div style="font-size:11px;margin-top:6px"><a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(url)+'</a></div>';
  audit("dpp.gen",lot);
}

    faqs.map(f=>'<div class="card" style="margin-bottom:10px"><h3>'+esc(f[0])+'</h3><p style="font-size:12.5px;color:var(--mut)">'+esc(f[1])+'</p></div>').join("")+
    '<div class="card ac"><h3>🤖 ¿No encuentras respuesta?</h3><button class="btn primary" onclick="go(\'sabionda\')">Preguntar a SABIONDA</button> <a class="btn" href="'+CFG.WEB+'" target="_blank" rel="noopener">Ir a la web</a></div>';
};

/* ════════════════════ ARRANQUE ════════════════════ */
function bootApp(){
  $("#login").style.display="none";$("#app").hidden=false;
  $("#avatar").textContent=(state.user.name||"?")[0];
  renderNav();
  var first=MODULES.find(m=>can(m.id));
  go(can(state.view)?state.view:(first?first.id:"faq"));
  updateNet();updateTok();
  healthCheck();
  window.addEventListener("online",function(){net.online=true;updateNet();flushQueue();toast("🟢 Conexión recuperada");});
  window.addEventListener("offline",function(){net.online=false;updateNet();toast("🔴 Sin conexión — modo offline","warn");});
  setInterval(function(){if(state.view==="dashboard"||state.view==="grid")go(state.view);},30000);
  audit("app.boot","v"+CFG.VERSION);
}
function initApp(){
  applyPrefs();
  var sess=store.getJSON("castuo_session",null);
  if(sess&&(Date.now()-sess.ts)<86400000&&sess.fp===fingerprint()){state.user=sess;bootApp();}
  else{if(sess)audit("auth.expired",sess.email,"security");store.del("castuo_session");renderLogin();}
}
initApp();
</script>
</body>
</html>
